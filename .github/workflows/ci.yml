# Unit tests and the type check, on every push and pull request.
# The end-to-end scripts are not run here: they need a running bb.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # No lifecycle scripts: nothing a dependency ships runs here.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
